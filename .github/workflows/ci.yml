name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: MelodyPopKit tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: swift test
        working-directory: Packages/MelodyPopKit
        run: |
          set -o pipefail
          swift test 2>&1 | tail -150

  app:
    name: App build, unit & UI tests (${{ matrix.device }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          want='${{ matrix.device }}'
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith(want)]
          c.sort(key=lambda x: x['name'])
          print(c[-1]['udid'] if want=='iPhone' else c[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project MelodyPop.xcodeproj \
            -scheme MelodyPop \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults-${{ matrix.device }}.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | grep -E "error:|warning: .*MelodyPop|Test Case|Executed|\*\* (BUILD|TEST)|failed|XCTAssert" | tail -300
      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ matrix.device }}
          path: TestResults-${{ matrix.device }}.xcresult
